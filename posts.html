---
layout: posts
title: Random thoughts
---

<ul class="big-list">
  {% for post in site.posts %}
  <li>
    <div class="title">
      <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
      <small>{{ post.tag }} {{ post.date | date: '%A, %e. %B %Y' }}</small>
    </div>
    <p>{{ post.excerpt }}</p>
  </li>
  {% endfor %}
</ul>
